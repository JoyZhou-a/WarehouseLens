<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>依赖体检 · WMS</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171c22; --line: #262d36;
    --text: #e6edf3; --dim: #8b98a5;
    --ok: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 13px; }
  header .grow { flex: 1; }
  button {
    background: #21262d; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #2b323b; }
  button:disabled { opacity: .5; cursor: default; }
  .banner {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 18px; border-radius: 8px; margin-bottom: 18px;
    border: 1px solid var(--line); background: var(--panel);
  }
  .banner.ok { border-color: rgba(63,185,80,.45); }
  .banner.bad { border-color: rgba(248,81,73,.45); }
  .banner .big { font-size: 16px; font-weight: 600; }
  .banner .meta { color: var(--dim); font-size: 13px; }
  .banner .grow { flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(63,185,80,.14); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 4px rgba(248,81,73,.14); }
  .dot.wait { background: var(--warn); }
  .targets {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1px; background: var(--line); border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden; margin-bottom: 18px;
  }
  .targets div { background: var(--panel); padding: 10px 14px; }
  .targets .k { color: var(--dim); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .targets .v { font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #1b2027; color: var(--dim); font-weight: 500; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  tbody tr:last-child td { border-bottom: none; }
  tr.ok td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
  tr.bad td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
  td.name { font-weight: 600; white-space: nowrap; }
  td.target, code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; color: var(--dim); }
  td.ms { white-space: nowrap; color: var(--dim); font-variant-numeric: tabular-nums; }
  .detail { color: var(--text); }
  .err { color: var(--bad); font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; word-break: break-word; }
  .hint { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
  .hint code { background: #10151a; padding: 1px 6px; border-radius: 4px; color: #c9d1d9; }
  .foot { color: var(--dim); font-size: 12.5px; margin-top: 18px; }
  .foot code { background: #10151a; padding: 1px 6px; border-radius: 4px; }
  label.auto { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>依赖体检</h1>
    <span class="sub">MySQL · Neo4j · Redis · Milvus</span>
    <span class="grow"></span>
    <label class="auto"><input type="checkbox" id="auto" checked> 每 5 秒自动刷新</label>
    <button id="run">立即检测</button>
  </header>

  <div class="banner" id="banner">
    <span class="dot wait" id="dot"></span>
    <span class="big" id="title">检测中…</span>
    <span class="meta" id="meta"></span>
    <span class="grow"></span>
    <span class="meta" id="when"></span>
  </div>

  <div class="targets" id="targets"></div>

  <table>
    <thead>
      <tr><th style="width:34px"></th><th>组件</th><th>目标</th><th>耗时</th><th>结果</th></tr>
    </thead>
    <tbody id="rows">
      <tr><td><span class="dot wait"></span></td><td class="name">等待</td><td></td><td></td><td class="detail">正在连接…</td></tr>
    </tbody>
  </table>

  <p class="foot">
    命令行同样能看：<code>python scripts/check_deps.py</code>　·　
    库在跑但没表：<code>python scripts/check_deps.py --init-schema</code>　·　
    改连接地址：项目根目录的 <code>.env</code>
  </p>
</div>

<script>
const $ = (id) => document.getElementById(id);
let timer = null;
let busy = false;

const esc = (s) => String(s == null ? "" : s);

function render(d) {
  const banner = $("banner");
  banner.classList.toggle("ok", d.ok);
  banner.classList.toggle("bad", !d.ok);
  $("dot").className = "dot " + (d.ok ? "ok" : "bad");
  $("title").textContent = d.ok
    ? "四个依赖全部就绪"
    : `有 ${d.total - d.passed} 个依赖没通过（${d.passed}/${d.total}）`;
  $("when").textContent = "检测于 " + d.checked_at;

  const t = d.targets || {};
  $("targets").innerHTML = Object.entries(t).map(([k, v]) =>
    `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`
  ).join("");

  $("rows").innerHTML = (d.checks || []).map((c) => {
    const body = c.ok
      ? `<span class="detail">${esc(c.detail)}</span>`
      : `<span class="err">${esc(c.error)}</span>`;
    const hint = c.ok ? "" : (c.hint ? `<div class="hint">${esc(c.hint)}</div>` : "");
    return `<tr class="${c.ok ? "ok" : "bad"}">
      <td><span class="dot ${c.ok ? "ok" : "bad"}"></span></td>
      <td class="name">${esc(c.name)}</td>
      <td class="target">${esc(c.target)}</td>
      <td class="ms">${c.ms} ms</td>
      <td>${body}${hint}</td>
    </tr>`;
  }).join("");
}

function fail(msg) {
  const banner = $("banner");
  banner.classList.remove("ok");
  banner.classList.add("bad");
  $("dot").className = "dot bad";
  $("title").textContent = "连后端都连不上";
  $("meta").textContent = msg;
  $("rows").innerHTML = `<tr class="bad">
    <td><span class="dot bad"></span></td>
    <td class="name">FastAPI</td><td></td><td></td>
    <td><span class="err">${esc(msg)}</span>
    <div class="hint">后端没起？先跑 <code>python run.py</code></div></td></tr>`;
}

async function run() {
  if (busy) return;
  busy = true;
  $("run").disabled = true;
  $("meta").textContent = "请求 /api/deps …";
  try {
    const res = await fetch("/api/deps", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
    $("meta").textContent = "";
  } catch (e) {
    fail(e.message || String(e));
  } finally {
    busy = false;
    $("run").disabled = false;
  }
}

function schedule() {
  clearInterval(timer);
  if ($("auto").checked) timer = setInterval(run, 5000);
}

$("run").addEventListener("click", run);
$("auto").addEventListener("change", schedule);
run();
schedule();
</script>
</body>
</html>
