<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WMS 仓储归因助手 · 多 agent</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --text:#111827; --muted:#6b7280;
  --accent:#1f5eff; --accent-soft:#eef3ff; --ok:#12805c; --ok-soft:#e7f6ef;
  --err:#b42318; --err-soft:#fdecea; --warn:#8a5a00;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.55 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
header .spacer{flex:1}
.badge{font-size:11.5px;padding:3px 8px;border-radius:999px;background:#f3f4f6;color:var(--muted);
  border:1px solid var(--line);white-space:nowrap}
.badge.on{background:var(--ok-soft);color:var(--ok);border-color:#bde7d4}
.badge.off{background:var(--err-soft);color:var(--err);border-color:#f3c9c4}

.shell{display:grid;grid-template-columns:240px minmax(420px,1fr) 360px;gap:14px;padding:14px;
  height:calc(100vh - 57px)}
aside,section{min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.small{font-size:12px}.muted{color:var(--muted)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#f3f4f6}
.pill.sys{background:var(--accent-soft);color:var(--accent)}
.pill.base{background:#f3f4f6;color:var(--muted)}

/* 左：会话 */
#sessions{display:flex;flex-direction:column;gap:10px}
#session-list{overflow:auto;display:flex;flex-direction:column;gap:4px;padding:8px}
.sess{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.sess:hover{background:#f9fafb}
.sess.on{background:var(--accent-soft);border-color:#cfdcff}
.sess .t{font-size:12.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sess .m{font-size:11px;color:var(--muted);margin-top:2px}

/* 中：对话 */
#chat{display:flex;flex-direction:column;gap:0;overflow:hidden}
#thread{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:100%}
.msg .who{font-size:11px;color:var(--muted);width:44px;flex:0 0 44px;padding-top:3px}
.bubble{background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  max-width:min(760px,100%);white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--accent-soft);border-color:#cfdcff}
.bubble table{margin-top:8px;width:100%;border-collapse:collapse;font-size:12px}
.bubble th,.bubble td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.bubble td.num{text-align:right;font-variant-numeric:tabular-nums}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
#q{width:100%;min-height:60px;resize:vertical;border:1px solid var(--line);border-radius:10px;
  padding:10px;font:inherit;outline:none}
#q:focus{border-color:#b9c9ff;box-shadow:0 0 0 3px #eef3ff}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:6px 12px;font:inherit;font-size:13px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{font-size:12px;background:#f9fafb;border-radius:8px;padding:5px 8px;cursor:pointer;
  border:1px dashed var(--line)}
.preset:hover{border-color:#c9d6ff}

/* 右：运行评测 */
#run{display:flex;flex-direction:column;overflow:hidden}
#run-body{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.kv b{font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--err)}.dot.run{background:#d97706}
.box{border-radius:8px;padding:8px 10px;font-size:12px}
.box.ok{background:var(--ok-soft);color:var(--ok)}
.box.err{background:var(--err-soft);color:var(--err)}
.box.info{background:#f9fafb;color:var(--muted)}
.step{display:grid;grid-template-columns:52px 1fr auto;gap:6px;font-size:11.5px;
  padding:2px 0;border-bottom:1px dashed #f1f2f4}
.step .ag{font-weight:600}
.step .tl{color:var(--muted);font-family:ui-monospace,Consolas,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#live{font-size:12px;color:var(--accent);min-height:16px}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid #cfdcff;
  border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:11.5px;padding:6px}
@media (max-width:1200px){.shell{grid-template-columns:1fr;height:auto}
  #sessions{order:3}#run{order:2}#thread{max-height:60vh}}
</style>
</head>
<body>
<header>
  <h1>WMS 仓储归因助手</h1>
  <span class="badge" id="b-onto">ontology</span>
  <span class="badge" id="b-llm">llm</span>
  <span class="spacer"></span>
  <span class="badge" id="b-db">db</span>
</header>

<main class="shell">
  <aside class="card" id="sessions">
    <div class="card-h">会话
      <button id="btn-new" style="font-size:12px;padding:3px 8px">新对话</button>
    </div>
    <div id="session-list"></div>
  </aside>

  <section class="card" id="chat">
    <div class="card-h">对话 <span class="small muted" id="thread-meta"></span></div>
    <div id="thread"></div>
    <div class="composer">
      <div id="live"></div>
      <textarea id="q" placeholder="例如：这周哪些货要发？ / 客户 C-2024-017 下周一要 500 台 NB-X1C-14，能承诺吗"></textarea>
      <div class="presets" id="presets"></div>
      <div class="actions">
        <button class="primary" id="btn-send">发送</button>
        <select id="mode" style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit">
          <option value="system">多 agent 编排</option>
          <option value="pipeline">固定流水线（对照）</option>
          <option value="baseline">RAG 基线（对照）</option>
        </select>
        <button id="btn-onto">本体定义</button>
      </div>
    </div>
  </section>

  <aside class="card" id="run">
    <div class="card-h">运行评测 <span class="small muted" id="run-meta"></span></div>
    <div id="run-body"><span class="muted small">还没有执行</span></div>
  </aside>
</main>
<footer>数据为合成数据，仅用于演示。数量由代码按本体口径计算，模型只负责组织语言。</footer>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = (n) => (n === null || n === undefined) ? "-" : Number(n).toLocaleString("zh-CN");

const ROLE = {planner:"规划", main:"主 agent", inventory:"库存子 agent", graph:"图谱子 agent",
              doc:"文档子 agent", verifier:"校验", system:"系统"};
let SESSION = localStorage.getItem("wms_session") || "";
let CURRENT = null;   // 当前任务状态
let es = null;

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error((await r.text()).slice(0, 200));
  return r.json();
}

/* ---------------- 会话 ---------------- */
async function loadSessions() {
  const list = await api("/api/sessions").catch(() => []);
  const box = $("#session-list");
  if (!list.length) { box.innerHTML = '<span class="muted small" style="padding:6px">还没有会话</span>'; return; }
  box.innerHTML = list.map((s) => `
    <div class="sess ${s.id === SESSION ? "on" : ""}" data-id="${s.id}">
      <div class="t">${esc(s.title)}</div>
      <div class="m">${s.count} 条消息</div>
    </div>`).join("");
  box.querySelectorAll(".sess").forEach((el) => {
    el.onclick = () => { SESSION = el.dataset.id; localStorage.setItem("wms_session", SESSION);
      loadSessions(); loadThread(); };
  });
}

async function newSession() {
  const r = await api("/api/session", {method: "POST"});
  SESSION = r.session_id;
  localStorage.setItem("wms_session", SESSION);
  await loadSessions(); await loadThread();
}

function bubble(role, content, meta) {
  const who = role === "user" ? "你" : "系统";
  const stamp = meta ? ` <span class="muted small">${meta.elapsed_ms || ""}ms · ${meta.mode || ""}</span>` : "";
  return `<div class="msg ${role}"><div class="who">${who}</div>
    <div class="bubble">${content}${stamp}</div></div>`;
}

async function loadThread() {
  const t = $("#thread");
  if (!SESSION) { t.innerHTML = '<span class="muted small">点「新对话」开始</span>'; return; }
  const d = await api(`/api/session/${SESSION}`).catch(() => ({messages: []}));
  if (!d.messages.length) { t.innerHTML = '<span class="muted small">这个会话还没有消息</span>'; }
  else t.innerHTML = d.messages.map((m) => bubble(m.role, esc(m.content), m.meta)).join("");
  $("#thread-meta").textContent = d.messages.length ? `${d.messages.length} 条` : "";
  t.scrollTop = t.scrollHeight;
}

/* ---------------- 提问 ---------------- */
async function send(question) {
  const q = (question ?? $("#q").value).trim();
  if (!q) return;
  if (!SESSION) await newSession();
  const mode = $("#mode").value;
  const thread = $("#thread");
  if (thread.querySelector(".muted.small")) thread.innerHTML = "";
  thread.insertAdjacentHTML("beforeend", bubble("user", esc(q)));
  const answerEl = document.createElement("div");
  answerEl.className = "msg assistant";
  answerEl.innerHTML = '<div class="who">系统</div><div class="bubble"><span class="spinner"></span>执行中…</div>';
  thread.appendChild(answerEl);
  thread.scrollTop = thread.scrollHeight;

  setBusy(true);
  resetRun(mode);
  $("#q").value = "";
  try {
    const {task_id} = await api("/api/ask/async", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: q, mode, session_id: SESSION}),
    });
    await follow(task_id, answerEl);
    await loadSessions();
  } catch (e) {
    answerEl.querySelector(".bubble").innerHTML = `<div class="box err">${esc(e.message)}</div>`;
  } finally {
    setBusy(false);
    $("#live").textContent = "";
  }
}

function follow(taskId, answerEl) {
  return new Promise((resolve) => {
    if (es) es.close();
    es = new EventSource(`/api/events/${taskId}`);
    es.onmessage = (ev) => {
      try { onStep(JSON.parse(ev.data)); } catch (_) {}
    };
    es.addEventListener("done", async () => {
      es.close(); es = null;
      const st = await api(`/api/task/${taskId}`).catch(() => null);
      if (st) {
        CURRENT = st;
        answerEl.querySelector(".bubble").innerHTML = esc(st.answer || "") + stampOf(st);
        renderRun(st);
        $("#thread").scrollTop = $("#thread").scrollHeight;
      }
      resolve();
    });
    es.addEventListener("timeout", () => { es.close(); es = null; resolve(); });
    es.onerror = () => { if (es) { es.close(); es = null; } resolve(); };
  });
}

const stampOf = (st) => `<div class="muted small" style="margin-top:8px">${st.elapsed_ms}ms · ${st.mode}</div>`;

/* ---------------- 运行时进度 ---------------- */
function onStep(e) {
  const role = ROLE[e.agent] || e.agent;
  if (e.tool === "start") { setLive(`<span class="spinner"></span>${role} 开始工作`); return; }
  if (e.tool === "done") { appendStep(e, role, "完成"); setLive(`<span class="spinner"></span>${role} 完成`); return; }
  if (e.tool === "use_observations") { appendStep(e, role, "步数到上限，用已取到的数据"); return; }
  if (e.tool === "finish") { appendStep(e, role, "给出结论"); return; }
  if (e.tool === "dispatch") { setLive(`<span class="spinner"></span>主 agent 派发：${(e.args?.tasks||[]).join(" + ")}`); appendStep(e, role, "派发"); return; }
  appendStep(e, role, (e.args ? summarizeArgs(e.args) : ""));
  setLive(`<span class="spinner"></span>${role} · ${e.tool}`);
  $("#thread").scrollTop = $("#thread").scrollHeight;
}

function summarizeArgs(a) {
  const s = Object.entries(a).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" ");
  return s.length > 60 ? s.slice(0, 60) + "…" : s;
}

function setLive(html) { $("#live").innerHTML = html || ""; }

function appendStep(e, role, suffix) {
  const body = $("#run-body");
  if (!body.dataset.live) {
    body.dataset.live = "1";
    body.innerHTML = '<div class="kv"><span>实时步骤</span><b id="step-count">0</b></div><div id="steps"></div>';
  }
  const n = (Number($("#step-count").textContent) || 0) + 1;
  $("#step-count").textContent = n;
  $("#steps").insertAdjacentHTML("beforeend", `
    <div class="step">
      <span class="ag">${role}</span>
      <span class="tl">${e.tool}${suffix ? " · " + esc(suffix) : ""}</span>
      <span class="muted">${e.ms || 0}ms</span>
    </div>`);
}

/* ---------------- 右侧评测 ---------------- */
function resetRun(mode) {
  $("#run-body").innerHTML = `<div class="kv"><span>模式</span><b>${mode}</b></div>
    <div class="kv"><span>状态</span><b><span class="dot run"></span>运行中</b></div>`;
  $("#run-body").dataset.live = "";
  $("#run-meta").textContent = "";
}

function renderRun(st) {
  const timings = st.agent_timings || {};
  const rows = Object.entries(timings).map(([name, t]) => `
    <tr>
      <td>${ROLE[name] || name}</td>
      <td class="n">${t.ms}</td>
      <td class="n">${t.steps}</td>
      <td class="small">${t.degraded ? '<span class="pill" style="background:#fdecea;color:#b42318">退回确定性</span>' : '<span class="pill">自主</span>'}</td>
    </tr>`).join("");
  const tools = Object.entries(timings).map(([name, t]) =>
    (t.tools || []).length ? `<div class="small muted">${ROLE[name] || name}：${t.tools.join(" → ")}</div>` : "").join("");
  const v = st.verification || {};
  const issues = (v.issues || []).map((i) => `<div class="small">[${i.level}] ${esc(i.msg)}</div>`).join("")
    || '<div class="small">没有发现问题</div>';

  $("#run-body").innerHTML = `
    <div class="kv"><span>模式</span><b>${st.mode}</b></div>
    <div class="kv"><span>总耗时</span><b>${st.elapsed_ms}ms</b></div>
    <div class="kv"><span>提问意图</span><b>${(st.parsed||{}).intent || "-"}</b></div>
    <table class="t"><thead><tr><th>角色</th><th class="n">耗时</th><th class="n">步</th><th>路径</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="muted">无</td></tr>'}</tbody></table>
    ${tools}
    <div class="box ${v.passed ? "ok" : "err"}"><b>校验${v.passed ? "通过" : "未通过"}</b>${issues}</div>`;
  $("#run-meta").textContent = st.elapsed_ms ? `${st.elapsed_ms}ms` : "";
}

function setBusy(b) {
  ["#btn-send", "#btn-new"].forEach((s) => { const el = $(s); if (el) el.disabled = b; });
}

/* ---------------- 其余 ---------------- */
async function loadHealth() {
  try {
    const h = await api("/api/health");
    $("#b-onto").textContent = "ontology " + h.ontology_version;
    $("#b-onto").className = "badge on";
    $("#b-llm").textContent = "llm " + h.llm.mode + " / " + h.llm.model;
    $("#b-llm").className = "badge " + (h.llm.live ? "on" : "");
    const ok = [h.mysql === true, h.neo4j === true, String(h.milvus).startsWith("milvus")].filter(Boolean).length;
    $("#b-db").textContent = `db mysql:${h.mysql ? "on" : "off"} neo4j:${h.neo4j ? "on" : "off"} milvus:${h.milvus}`;
    $("#b-db").className = "badge " + (ok === 3 ? "on" : "off");
  } catch (e) {
    $("#b-db").textContent = "服务未就绪"; $("#b-db").className = "badge off";
  }
}

async function loadPresets() {
  const list = await api("/api/demo").catch(() => []);
  $("#presets").innerHTML = list.map((q) =>
    `<span class="preset" data-q="${esc(q.text)}"><b>${q.id}</b> ${esc(q.text)}</span>`).join("");
  document.querySelectorAll(".preset").forEach((el) => {
    el.onclick = () => { $("#q").value = el.dataset.q; $("#q").focus(); };
  });
}

let ONTO = false;
async function toggleOntology() {
  ONTO = !ONTO;
  const card = $("#onto-card");
  if (!card) return;
  card.classList.toggle("hidden", !ONTO);
  if (!ONTO) return;
  const o = await api("/api/ontology");
  $("#onto-meta").textContent = `${o.version} · ${o.classes.length} 类 · ${o.relations.length} 关系 · ${o.rules.length} 规则`;
  const classes = o.classes.map((c) => `<div class="small">${c.name}：${(c.props||[]).join(", ")}</div>`).join("");
  const metrics = o.metrics.map((m) => `<div class="small"><b>${m.label}</b> = ${esc(m.formula)}</div>`).join("");
  const rules = o.rules.map((r) => `<div class="small" style="display:flex;gap:8px;align-items:center">
      <b>${r.id}</b><span>${esc(r.label)}</span>
      <label style="margin-left:auto"><input type="checkbox" ${r.enabled ? "checked" : ""}
        onchange="toggleRule('${r.id}', this.checked)"> ${r.enabled ? "启用" : "停用"}</label></div>`).join("");
  $("#onto-body").innerHTML = `<div class="small muted">类</div>${classes}
    <div class="small muted" style="margin-top:8px">指标</div>${metrics}
    <div class="small muted" style="margin-top:8px">规则（改的是文件）</div>${rules}`;
}

async function toggleRule(id, enabled) {
  await api(`/api/ontology/rule/${id}`, {method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify({enabled})});
  await loadHealth();
}

$("#btn-send").onclick = () => send();
$("#q").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); send(); }
});
$("#btn-new").onclick = newSession;
$("#btn-onto").onclick = toggleOntology;

(async () => {
  await loadHealth(); await loadPresets();
  if (!SESSION) await newSession(); else { await loadSessions(); await loadThread(); }
  setInterval(loadHealth, 20000);
  const params = new URLSearchParams(location.search);
  const want = params.get("q");
  if (want) {
    const list = await api("/api/demo").catch(() => []);
    const hit = list.find((x) => x.id.toLowerCase() === want.toLowerCase());
    $("#q").value = hit ? hit.text : want;
    if (params.get("mode")) $("#mode").value = params.get("mode");
    await send();
  }
})();
</script>
<div class="card hidden" id="onto-card" style="position:fixed;right:16px;bottom:16px;width:420px;max-height:70vh;overflow:auto;z-index:20">
  <div class="card-h">本体定义 <span class="small muted" id="onto-meta"></span></div>
  <div id="onto-body" style="padding:10px"></div>
</div>
</body>
</html>
