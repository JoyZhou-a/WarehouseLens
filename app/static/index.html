<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WMS 仓储归因助手</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1a1d21; --muted:#6b7280;
    --line:#e5e7eb; --accent:#1f5eff; --accent-soft:#eef3ff;
    --ok:#0f7b4f; --warn:#a15c00; --err:#b42318;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;
         background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  .badges{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;background:#f1f3f5;
         color:var(--muted);border:1px solid var(--line);white-space:nowrap}
  .badge.on{background:#e9f7f0;color:var(--ok);border-color:#c8ebda}
  .badge.off{background:#fdf0ee;color:var(--err);border-color:#f6d5d0}
  main{display:grid;grid-template-columns:minmax(380px,44%) 1fr;gap:16px;padding:16px 22px 40px;
       align-items:start;max-width:1680px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card + .card{margin-top:14px}
  .card-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
          margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  textarea{width:100%;min-height:86px;resize:vertical;border:1px solid var(--line);
           border-radius:8px;padding:10px;font:inherit;outline:none}
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .presets{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .preset{text-align:left;border:1px solid var(--line);background:#fafbfc;border-radius:8px;
          padding:8px 10px;cursor:pointer;font:inherit;color:var(--ink)}
  .preset:hover{border-color:var(--accent);background:var(--accent-soft)}
  .preset b{color:var(--accent);margin-right:6px}
  .preset small{display:block;color:var(--muted);font-size:12px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;border-radius:8px;padding:8px 14px;cursor:pointer;
         border:1px solid var(--line);background:#fff}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{filter:brightness(1.06)}
  button:disabled{opacity:.55;cursor:default}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .answer{white-space:pre-wrap;font-size:14px;line-height:1.75}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
        background:#f1f3f5;color:var(--muted);margin-left:6px}
  .pill.sys{background:var(--accent-soft);color:var(--accent)}
  .pill.base{background:#fff4e5;color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px}
  td.num{font-variant-numeric:tabular-nums;text-align:right}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .trace{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
  .step{display:grid;grid-template-columns:64px 76px 1fr auto;gap:8px;align-items:baseline;
        padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fafbfc}
  .step .agent{font-weight:600}
  .step .tool{color:var(--muted);font-family:ui-monospace,Consolas,monospace}
  .step .res{color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--err)}
  .ev{border-left:3px solid var(--accent-soft);padding:4px 0 4px 10px;margin:8px 0}
  .ev .t{font-weight:600;font-size:13px}
  .ev .s{color:var(--muted);font-size:12px}
  .ev .x{font-size:12.5px;color:#374151;margin-top:2px}
  .box{border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
  .box.ok{background:#e9f7f0;color:#0b5d3b}
  .box.warn{background:#fff6e5;color:#7a4600}
  .box.err{background:#fdecea;color:#8a1c12}
  .rule{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);
        border-radius:8px;margin-bottom:8px}
  .rule .id{font-weight:700;color:var(--accent);min-width:26px}
  .rule .when{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
  .switch{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #cbd5e1;
           border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 24px}
  @media (max-width:1100px){main{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>WMS 仓储归因助手</h1>
  <div class="badges">
    <span class="badge" id="b-onto">ontology</span>
    <span class="badge" id="b-llm">llm</span>
    <span class="badge" id="b-db">databases</span>
    <button id="btn-onto" style="font-size:12px;padding:4px 10px">本体</button>
  </div>
</header>

<main>
  <section>
    <div class="card">
      <div class="card-h">提问</div>
      <textarea id="q" placeholder="例如：客户 C-2024-017 下周一要 500 台 NB-X1C-14，能承诺吗"></textarea>
      <div class="presets" id="presets"></div>
      <div class="actions">
        <button class="primary" id="btn-sys">系统回答</button>
        <button id="btn-base">RAG 基线</button>
        <button id="btn-cmp">并排对比</button>
      </div>
    </div>
    <div class="card">
      <div class="card-h">编排过程 <span class="small muted" id="trace-meta"></span></div>
      <div class="trace" id="trace"><span class="muted small">还没有执行</span></div>
    </div>
  </section>

  <section>
    <div id="out"><div class="card"><span class="muted">输入问题后选择一种模式执行。</span></div></div>
    <div class="card hidden" id="onto-card">
      <div class="card-h">本体定义 <span class="small muted" id="onto-meta"></span></div>
      <div id="onto-body"></div>
    </div>
  </section>
</main>

<footer>数据为合成数据，仅用于演示。数量由代码按本体口径计算，模型只负责组织语言。</footer>

<script>
const $ = (s) => document.querySelector(s);
const fmt = (n) => (n === null || n === undefined) ? "-" : Number(n).toLocaleString("zh-CN");

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error((await r.text()).slice(0, 200));
  return r.json();
}

async function loadHealth() {
  try {
    const h = await api("/api/health");
    const b = $("#b-onto");
    b.textContent = "ontology " + h.ontology_version;
    b.className = "badge on";

    const l = $("#b-llm");
    l.textContent = "llm " + h.llm.mode + " / " + h.llm.model;
    l.className = "badge " + (h.llm.live ? "on" : "");

    const d = $("#b-db");
    const okCount = [h.mysql === true, h.neo4j === true, h.milvus === "milvus"].filter(Boolean).length;
    d.textContent = `db mysql:${h.mysql ? "on" : "off"} neo4j:${h.neo4j ? "on" : "off"} milvus:${h.milvus} state:${h.state}`;
    d.className = "badge " + (okCount === 3 ? "on" : "off");
  } catch (e) {
    $("#b-db").textContent = "服务未就绪";
    $("#b-db").className = "badge off";
  }
}

async function loadDemo() {
  const list = await api("/api/demo");
  const box = $("#presets");
  box.innerHTML = "";
  list.forEach((q) => {
    const el = document.createElement("button");
    el.className = "preset";
    el.innerHTML = `<b>${q.id}</b>${q.text}<small>${q.hint}</small>`;
    el.onclick = () => { $("#q").value = q.text; };
    box.appendChild(el);
  });
}

function renderTrace(events) {
  const box = $("#trace");
  if (!events || !events.length) { box.innerHTML = '<span class="muted small">没有记录</span>'; return; }
  box.innerHTML = events.map((e) => `
    <div class="step">
      <span class="muted">${e.ts}</span>
      <span class="agent">${e.agent}</span>
      <span class="tool">${e.tool}<span class="res">  ${summarize(e.result)}</span></span>
      <span><span class="dot ${e.ok ? "ok" : "bad"}"></span> ${e.ms}ms</span>
    </div>`).join("");
  $("#trace-meta").textContent = events.length + " 步";
}

function summarize(r) {
  if (!r || typeof r !== "object") return "";
  if (r.total_promiseable !== undefined)
    return `可承诺 ${r.total_promiseable} / 需求 ${r.demand} / 缺口 ${r.gap}`;
  if (r.hits !== undefined) return `命中 ${r.hits} 段 (${r.backend || ""})`;
  if (r.substitutes !== undefined) return `替代 ${r.substitutes} 条，在途 ${r.inbound} 单`;
  if (r.passed !== undefined) return r.passed ? "通过" : "未通过";
  return Object.keys(r).slice(0, 3).join(",");
}

function warehouseTable(inv) {
  if (!inv || !inv.warehouses) return "";
  const rows = inv.warehouses.map((w) => `
    <tr>
      <td>${w.warehouse_name}<div class="muted small">${w.warehouse_type}</div></td>
      <td class="num">${fmt(w.on_hand)}</td>
      <td class="num">${fmt(w.allocated + w.reserved)}</td>
      <td class="num">${fmt(w.hold_qty)}</td>
      <td class="num">${fmt(w.available)}</td>
      <td class="num"><b>${fmt(w.promiseable)}</b></td>
      <td class="small">${w.blocked_by.length ? `<span style="color:var(--err)">${w.blocked_by.join(" ")}</span>` : '<span class="muted">-</span>'}</td>
    </tr>`).join("");
  return `<table>
    <thead><tr><th>仓库</th><th>在库</th><th>占用</th><th>扣留</th><th>可用</th><th>可承诺</th><th>规则</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function supplyBlock(inv) {
  if (!inv || !inv.supply || !inv.supply.length) return "";
  const items = inv.supply.map((s) => `
    <div class="ev">
      <div class="t">在途 ${s.shipment} · ${fmt(s.qty)} 台 · ${s.eta_days} 天到仓
        ${s.countable ? '<span class="pill">计入</span>' : '<span class="pill" style="background:#fdecea;color:#b42318">被排除</span>'}</div>
      <div class="s">批次 ${s.batch}，剩余效期 ${s.expiry_days} 天${s.blocked_by.length ? "，命中 " + s.blocked_by.join("、") : ""}</div>
      ${s.reason && s.reason.length ? `<div class="x">${s.reason[0]}</div>` : ""}
    </div>`).join("");
  return `<div class="card-h" style="margin-top:14px">在途供应</div>${items}`;
}

function evidenceBlock(ev) {
  if (!ev || !ev.length) return "";
  return `<div class="card-h" style="margin-top:14px">文档证据</div>` + ev.map((e) => `
    <div class="ev">
      <div class="t">${e.doc_id} <span class="pill">${e.score}</span></div>
      <div class="s">第 ${e.chunk_no + 1} 段 · ${e.backend || ""}</div>
      <div class="x">${e.text.replace(/\n/g, " ").slice(0, 200)}...</div>
    </div>`).join("");
}

function verifyBlock(v) {
  if (!v) return "";
  const cls = v.passed ? "ok" : "err";
  const lines = (v.issues || []).map((i) =>
    `<div class="small" style="margin-top:4px">[${i.level}] ${i.msg}</div>`).join("");
  return `<div class="box ${cls}"><b>校验${v.passed ? "通过" : "未通过"}</b>${lines || '<div class="small">没有发现问题</div>'}</div>`;
}

function render(state, slot) {
  const inv = (state.facts && state.facts.inventory) || null;
  const head = slot === "system"
    ? `<span class="pill sys">系统</span>`
    : `<span class="pill base">RAG 基线</span>`;
  return `<div class="card">
    <div class="card-h"><span>${head} ${state.elapsed_ms} ms</span><span class="small muted">${state.ontology_version ? "ontology " + state.ontology_version : ""}</span></div>
    <div class="answer">${esc(state.answer || "")}</div>
    ${inv ? warehouseTable(inv) : ""}
    ${inv ? supplyBlock(inv) : ""}
    ${evidenceBlock(state.evidence)}
    ${verifyBlock(state.verification)}
  </div>`;
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function run(mode) {
  const q = $("#q").value.trim();
  if (!q) { $("#q").focus(); return; }
  setBusy(true);
  $("#out").innerHTML = `<div class="card"><span class="spinner"></span> 执行中</div>`;
  try {
    const st = await api("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, mode }),
    });
    renderTrace(st.trace);
    $("#out").innerHTML = render(st, mode);
  } catch (e) {
    $("#out").innerHTML = `<div class="card"><div class="box err">${esc(e.message)}</div></div>`;
  } finally {
    setBusy(false);
    loadHealth();
  }
}

async function compare() {
  const q = $("#q").value.trim();
  if (!q) { $("#q").focus(); return; }
  setBusy(true);
  $("#out").innerHTML = `<div class="card"><span class="spinner"></span> 两条路径同时执行</div>`;
  try {
    const body = JSON.stringify({ question: q });
    const [sys, base] = await Promise.all([
      api("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q, mode: "system" }) }),
      api("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q, mode: "baseline" }) }),
    ]);
    renderTrace(sys.trace);
    $("#out").innerHTML = `<div class="grid2">
      <div>${render(base, "baseline")}</div>
      <div>${render(sys, "system")}</div>
    </div>`;
  } catch (e) {
    $("#out").innerHTML = `<div class="card"><div class="box err">${esc(e.message)}</div></div>`;
  } finally {
    setBusy(false);
    loadHealth();
  }
}

function setBusy(b) {
  ["#btn-sys", "#btn-base", "#btn-cmp"].forEach((s) => { $(s).disabled = b; });
}

async function loadOntology() {
  const o = await api("/api/ontology");
  const card = $("#onto-card");
  card.classList.toggle("hidden");
  if (card.classList.contains("hidden")) return;
  $("#onto-meta").textContent = `${o.version} · ${o.classes.length} 类 · ${o.relations.length} 关系 · ${o.rules.length} 规则`;

  const classes = o.classes.map((c) => `
    <div class="rule">
      <div class="id">${c.name.slice(0, 2).toUpperCase()}</div>
      <div>
        <div><b>${c.label || c.name}</b> <span class="muted small">${c.name}</span></div>
        <div class="when">属性：${(c.props || []).join(", ")}</div>
      </div>
    </div>`).join("");

  const metrics = o.metrics.map((m) => `
    <div class="rule">
      <div class="id">Σ</div>
      <div>
        <div><b>${m.label}</b> <span class="muted small">${m.unit || ""}</span></div>
        <div class="when">${m.formula}</div>
      </div>
    </div>`).join("");

  const rules = o.rules.map((r) => `
    <div class="rule">
      <div class="id">${r.id}</div>
      <div>
        <div><b>${r.label}</b></div>
        <div class="when">当 ${JSON.stringify(r.when)} 则 ${r.then}</div>
      </div>
      <label class="switch">
        <input type="checkbox" ${r.enabled ? "checked" : ""} onchange="toggleRule('${r.id}', this.checked)" />
        ${r.enabled ? "启用" : "停用"}
      </label>
    </div>`).join("");

  $("#onto-body").innerHTML = `
    <div class="card-h">类</div>${classes}
    <div class="card-h" style="margin-top:12px">指标口径</div>${metrics}
    <div class="card-h" style="margin-top:12px">规则（可开关，改的是文件）</div>${rules}
    <div class="small muted" style="margin-top:8px">路径：${o.path}。开关会直接改这个文件，不重启服务就生效。</div>`;
}

async function toggleRule(id, enabled) {
  await api(`/api/ontology/rule/${id}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ enabled }),
  });
  await loadOntology();
  await loadHealth();
}

$("#btn-sys").onclick = () => run("system");
$("#btn-base").onclick = () => run("baseline");
$("#btn-cmp").onclick = compare;
$("#btn-onto").onclick = loadOntology;

loadDemo();
loadHealth();
setInterval(loadHealth, 15000);
</script>
</body>
</html>
